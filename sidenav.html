<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>archirhett</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        font-family: "Lato", sans-serif;
      }

      .main {
        margin-left: 200px; /* Same as the width of the sidenav */
      }

      @media screen and (max-height: 450px) {
        .sidenav {
          padding-top: 15px;
        }
        .sidenav a {
          font-size: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="sidenav">
      <div class="accordion-menu">
        <div class="accordion-header">
          <a href="#index">HOME</a>
        </div>
        <div class="accordion-content">
          <ul class="submenu">
            <li href="#about" class="submenu-item">about</li>
            <li href="#contact" class="submenu-item">contact</li>
          </ul>
        </div>
      </div>

      <a href="#">WORK</a>
      <a href="#">PLAY</a>
      <a href="#">Contact</a>
    </div>

    <div class="main">
      <h2>Sidenav Example</h2>
      <p>This sidenav is always shown.</p>
    </div>
  </body>
</html>
